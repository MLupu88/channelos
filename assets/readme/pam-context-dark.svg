<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity="0.18"/></filter>
</defs>
<rect width="1600" height="900" rx="28" fill="url(#bg)"/>
<text x="92" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#b8c0cf">PAM WORKSPACE</text>
<text x="92" y="140" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="750" fill="#f8fafc">The relationship has a memory</text>
<text x="92" y="180" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#b8c0cf">Structured CRM facts sit next to the background only the partner manager can explain.</text>

<g filter="url(#shadow)">
<rect x="92" y="230" width="1416" height="560" rx="24" fill="#0f172a" stroke="#293548"/>
</g>

<!-- top bar -->
<circle cx="132" cy="274" r="10" fill="#22c55e"/>
<text x="154" y="282" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="750" fill="#f8fafc">Northstar Systems</text>
<rect x="375" y="255" width="148" height="34" rx="17" fill="#173a2c"/>
<text x="449" y="278" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#86efac">Managed partner</text>
<text x="1328" y="278" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#b8c0cf">Sanitized demo data</text>

<!-- left main -->
<text x="132" y="352" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750" letter-spacing="1.2" fill="#b8c0cf">RELATIONSHIP BACKGROUND</text>
<rect x="132" y="378" width="852" height="264" rx="18" fill="#162238" stroke="#293548"/>
<text x="166" y="425" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#f8fafc">Executive sponsor is engaged and the joint go-to-market discussion</text>
<text x="166" y="460" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#f8fafc">reopened after the regional launch. The relationship is warm, but the</text>
<text x="166" y="495" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#f8fafc">next step still depends on agreement around ownership and co-selling.</text>
<text x="166" y="548" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#f8fafc">The PAM can write this in their own words instead of forcing it into a</text>
<text x="166" y="583" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#f8fafc">CRM field that was never designed to hold the full relationship story.</text>
<text x="166" y="620" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c0cf">Updated today by Partner Manager A</text>

<!-- right context rail -->
<rect x="1024" y="330" width="430" height="390" rx="18" fill="#111c31" stroke="#293548"/>
<text x="1056" y="372" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="750" fill="#f8fafc">Current context</text>
<line x1="1056" y1="392" x2="1422" y2="392" stroke="#293548"/>

<text x="1056" y="436" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c0cf">HubSpot</text>
<text x="1422" y="436" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">2 open opportunities</text>
<text x="1056" y="492" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c0cf">Channel Radar</text>
<text x="1422" y="492" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">1 relevant signal</text>
<text x="1056" y="548" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c0cf">Quarter target</text>
<text x="1422" y="548" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#86efac">On track</text>
<text x="1056" y="604" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c0cf">Next action</text>
<text x="1422" y="604" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Align co-sell owner</text>
<line x1="1056" y1="632" x2="1422" y2="632" stroke="#293548"/>
<text x="1056" y="674" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c0cf">The point is not more notes.</text>
<text x="1056" y="700" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#b8c0cf">It is current context that survives the next meeting.</text>

<text x="92" y="846" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#b8c0cf">CRM facts + market context + PAM-written background → one relationship story people can actually use.</text>
</svg>